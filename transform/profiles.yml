fevs_intelligence:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('FEVS_DUCKDB', 'warehouse/fevs.duckdb') }}"
      schema: main
      threads: 4
    ci:
      type: duckdb
      path: "{{ env_var('FEVS_DUCKDB', 'warehouse/fevs_sample.duckdb') }}"
      schema: main
      threads: 4
    prod:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT', '') }}"
      user: "{{ env_var('SNOWFLAKE_USER', '') }}"
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH', '') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'TRANSFORMER') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'FEVS_XS') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'FEVS') }}"
      schema: main
      threads: 4
